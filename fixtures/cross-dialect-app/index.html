<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bundar HTMX Conformance Fixture</title>
    <script src="/assets/htmx.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Dual dialect fixture</h1>
      <p id="status">ready</p>
      <button
        id="load-fragment"
        hx-get="/fragment"
        hx-target="#status"
        hx-swap="innerHTML"
      >
        Load fragment
      </button>
      <form
        id="echo-form"
        hx-post="/echo"
        hx-target="#status"
        hx-swap="innerHTML"
      >
        <label>Name <input name="name" value="Bundar" /></label>
        <button type="submit">Submit</button>
      </form>
      <a
        id="history-link"
        href="/history-target"
        hx-get="/history-target"
        hx-target="#status"
        hx-push-url="true"
      >
        Load history target
      </a>
      <div id="boosted-zone" hx-boost="true">
        <a id="boosted-link" href="/page-fragment">Boosted items page</a>
      </div>
      <div id="multi-region-zone">
        <span id="mr-counter">0 items</span>
        <ul id="mr-list">
          <li>seed row</li>
        </ul>
        <button
          id="mr-trigger"
          hx-post="/multi-region"
          hx-target="#mr-target"
          hx-swap="innerHTML"
        >
          Update multi-region
        </button>
        <div id="mr-target"></div>
      </div>
      <p id="event-state">event: none</p>
    </main>
    <script>
      document.body.addEventListener("htmx:afterRequest", function () {
        document.querySelector("#event-state").textContent =
          "event: afterRequest";
      });
    </script>
  </body>
</html>

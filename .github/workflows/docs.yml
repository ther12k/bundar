name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: OKF structural validation
        run: bun run docs:validate
      - name: OKF link validation
        run: bun run docs:links
      - name: Issue dependency graph validation
        run: bun run issues:graph

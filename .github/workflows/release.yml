name: Release (human-gated)

# This workflow is MANUALLY triggered by the maintainer after completing all
# pre-publication checks documented in delivery/gates/registry.md and
# docs/maintainers/publishing.md.
#
# Safety invariants:
# - Wave 8 (Model B): the authoritative candidate is the SUCCESSFUL public
#   Candidate Release Battery bundle — identified by its exact run ID. Both
#   jobs first fail closed on the run's metadata (conclusion == success,
#   head_sha == this SHA, event == workflow_dispatch, workflow path ==
#   candidate-release.yml, status == completed), then download that exact
#   artifact, pin the immutable GitHub artifact digest (mandatory input),
#   re-verify every tarball SHA-256 and packed identity through the shared
#   strict loader, and publish those downloaded bytes. Nothing is rebuilt
#   or taken from the working tree.
# - Ref alignment: dispatch this workflow on the SAME ref the battery ran
#   on. Docs/evidence commits after the battery change GITHUB_SHA and the
#   metadata gate will reject the battery run — rerun the battery on the
#   final ref instead.
# - GH-171: both jobs refuse to run off main (github.ref check), and the
#   metadata gate requires the battery to have run on head_branch main.
#   The strongest boundary remains the npm-publish environment deployment
#   branch policy (see delivery/gates/registry.md and gate #130): protect
#   main and restrict the environment to it before any publication.
# - Wave 9 input hygiene: workflow_dispatch inputs NEVER appear inside
#   run: shell bodies (GitHub interpolates ${{ }} before the shell parses
#   the script, which is a shell-injection vector in this secret-bearing
#   job). They enter only through env: mappings and are validated against
#   strict allowlists (tag: canary|alpha|beta; version: exact semver;
#   digest: sha256:<64 hex>).
# - The publish step requires BOTH a GitHub Environment protection rule
#   (requiring maintainer review) AND the BUNDAR_RELEASE_TOKEN secret.
# - publish:approved -- --dry-run is always run first and exits 0 before
#   any npm publish call.
# - The workflow never prints or logs the npm token value.
# - Emergency revocation: deprecate the bad release with `npm deprecate`,
#   then publish a fixed version on the same dist-tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (canary | alpha | beta — never latest)"
        required: true
        default: "canary"
      version:
        description: "Exact semver candidate (e.g. 0.1.0-alpha.2)"
        required: true
        default: "0.1.0-alpha.2"
      battery_run_id:
        description: "Run ID of the successful Candidate Release Battery whose artifact bundle IS the candidate"
        required: true
        type: string
      expected_artifact_digest:
        description: "Mandatory sha256:<digest> of the battery bundle; both jobs abort on mismatch"
        required: true
        type: string
      dry_run_only:
        description: "Only perform dry-run verification (no actual npm publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    # GH-171: release preflight is a main-ref activity only.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout at exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate inputs and the authoritative battery run (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail

          case "$INPUT_TAG" in
            canary|alpha|beta) ;;
            *)
              echo "ERROR: dist-tag must be exactly canary, alpha, or beta (ADR-0021 pre-1.0 policy; 'latest' and arbitrary values are forbidden)." >&2
              exit 1
              ;;
          esac
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: version must be exact semver (e.g. 0.1.0-alpha.2); got '$INPUT_VERSION'." >&2
            exit 1
          fi
          if ! [[ "$BATTERY_RUN" =~ ^[0-9]+$ ]]; then
            echo "ERROR: battery_run_id must be a numeric workflow run ID; got '$BATTERY_RUN'." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: expected_artifact_digest must be 'sha256:<64 lowercase hex chars>'; got '$EXPECTED_DIGEST'." >&2
            exit 1
          fi

          # GH-169: only a SUCCESSFUL Candidate Release Battery run on this
          # exact ref may supply the candidate. Failed/cancelled batteries
          # upload their bundle with if: always() — existence alone is not
          # authority.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN" > /tmp/battery-run.json
          BATTERY_RUN_JSON=/tmp/battery-run.json python3 - <<'PY'
          import json, os, sys
          meta = json.load(open(os.environ["BATTERY_RUN_JSON"]))
          problems = []
          if meta.get("status") != "completed":
              problems.append(f"status={meta.get('status')} — run must be completed")
          if meta.get("conclusion") != "success":
              problems.append(
                  f"conclusion={meta.get('conclusion')} — only a SUCCESSFUL "
                  "Candidate Release Battery is an authoritative candidate"
              )
          if meta.get("event") != "workflow_dispatch":
              problems.append(f"event={meta.get('event')} — manual dispatch required")
          if meta.get("path") != ".github/workflows/candidate-release.yml":
              problems.append(
                  f"path={meta.get('path')} — not the Candidate Release Battery workflow"
              )
          if meta.get("head_sha") != os.environ.get("GITHUB_SHA", ""):
              problems.append(
                  f"head_sha={meta.get('head_sha')} != this workflow's SHA "
                  f"{os.environ.get('GITHUB_SHA', '')} — dispatch the release on the "
                  "same ref the battery ran on (or rerun the battery on the final ref)"
              )
          if meta.get("head_branch") != "main":
              problems.append(
                  f"head_branch={meta.get('head_branch')} — the battery must run on "
                  "main, not a feature branch (GH-171)"
              )
          if problems:
              print("Battery run rejected:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          print(
              f"Battery run accepted: {meta.get('name')} #{meta.get('run_number')} "
              f"({meta.get('conclusion')}) on {meta.get('head_sha', '')[:12]}"
          )
          PY

      - name: Download the authoritative candidate bundle (digest-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="release-candidate-artifacts-${GITHUB_SHA}"
          observed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest // empty")"
          if [ -z "$observed" ]; then
            echo "ERROR: no candidate bundle artifact $ARTIFACT_NAME found on run $BATTERY_RUN." >&2
            exit 1
          fi
          if [ "$EXPECTED_DIGEST" != "$observed" ]; then
            echo "ERROR: artifact digest mismatch — expected '$EXPECTED_DIGEST', observed '$observed'." >&2
            exit 1
          fi
          echo "Candidate bundle digest confirmed: $observed"

          rm -rf candidate-bundle && mkdir -p candidate-bundle
          gh run download "$BATTERY_RUN" --repo "$GITHUB_REPOSITORY" \
            -n "$ARTIFACT_NAME" -D candidate-bundle
          test -f candidate-bundle/artifacts/release/candidate-manifest.json \
            || { echo "ERROR: unexpected bundle layout" >&2; exit 1; }
          test -f candidate-bundle/artifacts/release/candidate-identity.json \
            || { echo "ERROR: bundle lacks candidate-identity.json (pre-wave-8 bundle)" >&2; exit 1; }
          echo "BUNDLE_DIR=$PWD/candidate-bundle" >> "$GITHUB_ENV"

      - name: Confirm pinned identity matches the bundle
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('artifacts/release/candidate-manifest.json'))['version'])")"
          BUNDLE_VERSION="$(python3 -c "import json;print(json.load(open('candidate-bundle/artifacts/release/candidate-manifest.json'))['version'])")"
          IDENTITY_VERSION="$(python3 -c "import json;print(json.load(open('candidate-bundle/artifacts/release/candidate-identity.json'))['version'])")"
          if [ "$INPUT_VERSION" != "$MANIFEST_VERSION" ] || [ "$INPUT_VERSION" != "$BUNDLE_VERSION" ] || [ "$INPUT_VERSION" != "$IDENTITY_VERSION" ]; then
            echo "ERROR: input version ($INPUT_VERSION) does not match candidate manifests (committed=$MANIFEST_VERSION bundle=$BUNDLE_VERSION identity=$IDENTITY_VERSION)." >&2
            exit 1
          fi
          echo "Version confirmed across input/committed/bundle: $INPUT_VERSION"

          INPUT_TAG="$INPUT_TAG" python3 - <<'PY'
          import json, os, sys
          identity = json.load(
              open("candidate-bundle/artifacts/release/candidate-identity.json")
          )
          problems = []
          if identity["workflowRunSha"] != os.environ.get("GITHUB_SHA", ""):
              problems.append(
                  "candidate-identity.workflowRunSha does not match the battery run commit"
              )
          expected_name = f"release-candidate-artifacts-{os.environ.get('GITHUB_SHA', '')}"
          if identity["artifactName"] != expected_name:
              problems.append(f"unexpected artifactName {identity['artifactName']}")
          if identity["distTag"] != os.environ["INPUT_TAG"]:
              problems.append(
                  f"candidate-identity distTag {identity['distTag']} != requested tag"
              )
          if len(identity["packages"]) != 9:
              problems.append(f"expected 9 packages, got {len(identity['packages'])}")
          if problems:
              print("Bundle identity check FAILED:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run full CI battery
        run: bun run ci:m4

      - name: Candidate dry-run against the DOWNLOADED bundle
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          bun run publish:approved -- \
            --dry-run \
            --tag "$INPUT_TAG" \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --tarball-root "$BUNDLE_DIR"

      - name: Cross-artifact verification
        run: bun run release:verify

  publish:
    name: Publish the authoritative bundle
    needs: preflight
    # GH-171: publication only from main (defense-in-depth; the npm-publish
    # environment deployment branch policy is the primary boundary).
    if: github.event.inputs.dry_run_only != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GH-171 least privilege: the report upload uses the job's runtime
    # token, not GITHUB_TOKEN write scopes.
    permissions:
      contents: read
      actions: read
    # BR-079: This environment must have a manual review rule configured in
    # GitHub → Settings → Environments → "npm-publish" so a human maintainer
    # must approve before the job starts.
    environment: npm-publish
    steps:
      - name: Checkout at exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clear committed evidence reports (this attempt's evidence only)
        run: |
          # GH-171: the checkout carries a preflight registry-verify.json with
          # "success": true. Remove it so the if: always() upload below can
          # never publish a stale successful-looking report after a failed
          # auth/publish; the post-publish verifier writes a fresh one.
          rm -f artifacts/registry-verify.json
          test ! -e artifacts/registry-verify.json

      - name: Validate inputs and the authoritative battery run (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail

          case "$INPUT_TAG" in
            canary|alpha|beta) ;;
            *)
              echo "ERROR: dist-tag must be exactly canary, alpha, or beta (ADR-0021)." >&2
              exit 1
              ;;
          esac
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: version must be exact semver; got '$INPUT_VERSION'." >&2
            exit 1
          fi
          if ! [[ "$BATTERY_RUN" =~ ^[0-9]+$ ]]; then
            echo "ERROR: battery_run_id must be numeric; got '$BATTERY_RUN'." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: expected_artifact_digest must be 'sha256:<64 hex>'; got '$EXPECTED_DIGEST'." >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN" > /tmp/battery-run.json
          BATTERY_RUN_JSON=/tmp/battery-run.json python3 - <<'PY'
          import json, os, sys
          meta = json.load(open(os.environ["BATTERY_RUN_JSON"]))
          problems = []
          if meta.get("status") != "completed":
              problems.append(f"status={meta.get('status')} — run must be completed")
          if meta.get("conclusion") != "success":
              problems.append(f"conclusion={meta.get('conclusion')} — only a SUCCESSFUL battery is authoritative")
          if meta.get("event") != "workflow_dispatch":
              problems.append(f"event={meta.get('event')} — manual dispatch required")
          if meta.get("path") != ".github/workflows/candidate-release.yml":
              problems.append(f"path={meta.get('path')} — not the Candidate Release Battery workflow")
          if meta.get("head_sha") != os.environ.get("GITHUB_SHA", ""):
              problems.append(
                  f"head_sha={meta.get('head_sha')} != {os.environ.get('GITHUB_SHA', '')}"
              )
          if meta.get("head_branch") != "main":
              problems.append(
                  f"head_branch={meta.get('head_branch')} — the battery must run on main (GH-171)"
              )
          if problems:
              print("Battery run rejected:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Download the authoritative candidate bundle (digest-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="release-candidate-artifacts-${GITHUB_SHA}"
          observed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest // empty")"
          if [ -z "$observed" ]; then
            echo "ERROR: no candidate bundle artifact $ARTIFACT_NAME found on run $BATTERY_RUN." >&2
            exit 1
          fi
          if [ "$EXPECTED_DIGEST" != "$observed" ]; then
            echo "ERROR: artifact digest mismatch — expected '$EXPECTED_DIGEST', observed '$observed'." >&2
            exit 1
          fi
          echo "Publishing bundle digest confirmed: $observed"

          rm -rf candidate-bundle && mkdir -p candidate-bundle
          gh run download "$BATTERY_RUN" --repo "$GITHUB_REPOSITORY" \
            -n "$ARTIFACT_NAME" -D candidate-bundle
          test -f candidate-bundle/artifacts/release/candidate-manifest.json \
            || { echo "ERROR: unexpected bundle layout" >&2; exit 1; }
          test -f candidate-bundle/artifacts/release/candidate-identity.json \
            || { echo "ERROR: bundle lacks candidate-identity.json" >&2; exit 1; }
          echo "BUNDLE_DIR=$PWD/candidate-bundle" >> "$GITHUB_ENV"

      - name: Authenticate npm
        # Uses NODE_AUTH_TOKEN, the standard convention; npm login is
        # not required when an appropriate automation token is configured
        # via the environment secret.
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish candidate (guarded — publishes ONLY the downloaded bundle)
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          # BUNDAR_RELEASE_TOKEN is the session approval sentinel; the real npm
          # credential travels through NODE_AUTH_TOKEN above.
          BUNDAR_RELEASE_TOKEN: ${{ secrets.BUNDAR_RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun run publish:approved -- \
            --tag "$INPUT_TAG" \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --tarball-root "$BUNDLE_DIR"

      - name: Post-publish registry verification (byte-for-byte vs the bundle)
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          bun run registry:verify -- \
            --tag "$INPUT_TAG" \
            --download \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --root-dir "$BUNDLE_DIR"

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.sha }}
          path: |
            artifacts/publish-dry-run.json
            artifacts/registry-verify.json
            candidate-bundle/artifacts/release/candidate-manifest.json
            candidate-bundle/artifacts/release/candidate-identity.json
            candidate-bundle/artifacts/packages/checksums.txt
          retention-days: 365

name: Release (human-gated)

# This workflow is MANUALLY triggered by the maintainer after completing all
# pre-publication checks documented in delivery/gates/registry.md and
# docs/maintainers/publishing.md.
#
# Safety invariants:
# - Wave 8 (Model B): the authoritative candidate is the SUCCESSFUL public
#   Candidate Release Battery bundle — identified by its exact run ID. Both
#   jobs download that exact artifact (`release-candidate-artifacts-<sha>`),
#   optionally pin the immutable GitHub artifact digest, re-verify every
#   tarball SHA-256 and packed identity through the shared strict loader,
#   and publish those downloaded bytes. Nothing is rebuilt or taken from the
#   working tree.
# - The publish step requires BOTH a GitHub Environment protection rule
#   (requiring maintainer review) AND the BUNDAR_RELEASE_TOKEN secret.
# - publish:approved -- --dry-run is always run first and exits 0 before
#   any npm publish call.
# - The workflow never prints or logs the npm token value.
# - Emergency revocation: deprecate the bad release with `npm deprecate`,
#   then publish a fixed version on the same dist-tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (canary | alpha | beta — never latest)"
        required: true
        default: "canary"
      version:
        description: "Exact semver candidate (e.g. 0.1.0-alpha.2)"
        required: true
        default: "0.1.0-alpha.2"
      battery_run_id:
        description: "Run ID of the successful Candidate Release Battery whose artifact bundle IS the candidate"
        required: true
        type: string
      expected_artifact_digest:
        description: "Optional sha256:<digest> of the bundle recorded at battery time; publish aborts on mismatch"
        required: false
        default: ""
        type: string
      dry_run_only:
        description: "Only perform dry-run verification (no actual npm publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the authoritative candidate bundle (digest-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="release-candidate-artifacts-${GITHUB_SHA}"
          observed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest // empty")"
          if [ -z "$observed" ]; then
            echo "ERROR: no candidate bundle artifact $ARTIFACT_NAME found on run $BATTERY_RUN." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_DIGEST" ] && [ "$EXPECTED_DIGEST" != "$observed" ]; then
            echo "ERROR: artifact digest mismatch — expected '$EXPECTED_DIGEST', observed '$observed'." >&2
            exit 1
          fi
          echo "Candidate bundle digest: $observed"

          head_sha="$(gh run view "$BATTERY_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          if [ "$head_sha" != "${GITHUB_SHA}" ]; then
            echo "ERROR: battery run $BATTERY_RUN executed on $head_sha, not this commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          rm -rf candidate-bundle && mkdir -p candidate-bundle
          gh run download "$BATTERY_RUN" --repo "$GITHUB_REPOSITORY" \
            -n "$ARTIFACT_NAME" -D candidate-bundle
          test -f candidate-bundle/artifacts/release/candidate-manifest.json \
            || { echo "ERROR: unexpected bundle layout" >&2; exit 1; }
          test -f candidate-bundle/artifacts/release/candidate-identity.json \
            || { echo "ERROR: bundle lacks candidate-identity.json (pre-wave-8 bundle)" >&2; exit 1; }
          echo "BUNDLE_DIR=$PWD/candidate-bundle" >> "$GITHUB_ENV"

      - name: Validate inputs (reject latest; pinned identity must match bundle)
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ "$TAG" = "latest" ]; then
            echo "ERROR: dist-tag 'latest' is forbidden during pre-1.0 (ADR-0021)." >&2
            echo "Use 'canary', 'alpha', or 'beta'." >&2
            exit 1
          fi
          INPUT_VERSION="${{ github.event.inputs.version }}"
          MANIFEST_VERSION="$(python3 -c "import json;print(json.load(open('artifacts/release/candidate-manifest.json'))['version'])")"
          BUNDLE_VERSION="$(python3 -c "import json;print(json.load(open('candidate-bundle/artifacts/release/candidate-manifest.json'))['version'])")"
          IDENTITY_VERSION="$(python3 -c "import json;print(json.load(open('candidate-bundle/artifacts/release/candidate-identity.json'))['version'])")"
          if [ "$INPUT_VERSION" != "$MANIFEST_VERSION" ] || [ "$INPUT_VERSION" != "$BUNDLE_VERSION" ] || [ "$INPUT_VERSION" != "$IDENTITY_VERSION" ]; then
            echo "ERROR: input version ($INPUT_VERSION) does not match candidate manifests (committed=$MANIFEST_VERSION bundle=$BUNDLE_VERSION identity=$IDENTITY_VERSION)." >&2
            exit 1
          fi
          echo "Version confirmed across input/committed/bundle: $INPUT_VERSION"

          INPUT_TAG="$TAG" python3 - <<'PY'
          import json, os, sys
          identity = json.load(
              open("candidate-bundle/artifacts/release/candidate-identity.json")
          )
          problems = []
          if identity["workflowRunSha"] != os.environ.get("GITHUB_SHA", ""):
              problems.append(
                  "candidate-identity.workflowRunSha does not match the battery run commit"
              )
          expected_name = f"release-candidate-artifacts-{os.environ.get('GITHUB_SHA', '')}"
          if identity["artifactName"] != expected_name:
              problems.append(f"unexpected artifactName {identity['artifactName']}")
          if identity["distTag"] != os.environ["INPUT_TAG"]:
              problems.append(
                  f"candidate-identity distTag {identity['distTag']} != requested tag"
              )
          if len(identity["packages"]) != 9:
              problems.append(f"expected 9 packages, got {len(identity['packages'])}")
          if problems:
              print("Bundle identity check FAILED:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run full CI battery
        run: bun run ci:m4

      - name: Candidate dry-run against the DOWNLOADED bundle
        run: |
          bun run publish:approved -- \
            --dry-run \
            --tag "${{ github.event.inputs.tag }}" \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --tarball-root "$BUNDLE_DIR"

      - name: Cross-artifact verification
        run: bun run release:verify

  publish:
    name: Publish ${{ github.event.inputs.version }} @ ${{ github.event.inputs.tag }}
    needs: preflight
    if: github.event.inputs.dry_run_only != 'true'
    runs-on: ubuntu-latest
    # BR-079: This environment must have a manual review rule configured in
    # GitHub → Settings → Environments → "npm-publish" so a human maintainer
    # must approve before the job starts.
    environment: npm-publish
    steps:
      - name: Checkout at exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the authoritative candidate bundle (digest-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          BATTERY_RUN: ${{ github.event.inputs.battery_run_id }}
          EXPECTED_DIGEST: ${{ github.event.inputs.expected_artifact_digest }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="release-candidate-artifacts-${GITHUB_SHA}"
          observed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BATTERY_RUN/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .digest // empty")"
          if [ -z "$observed" ]; then
            echo "ERROR: no candidate bundle artifact $ARTIFACT_NAME found on run $BATTERY_RUN." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_DIGEST" ] && [ "$EXPECTED_DIGEST" != "$observed" ]; then
            echo "ERROR: artifact digest mismatch — expected '$EXPECTED_DIGEST', observed '$observed'." >&2
            exit 1
          fi
          echo "Publishing bundle digest: $observed"

          rm -rf candidate-bundle && mkdir -p candidate-bundle
          gh run download "$BATTERY_RUN" --repo "$GITHUB_REPOSITORY" \
            -n "$ARTIFACT_NAME" -D candidate-bundle
          test -f candidate-bundle/artifacts/release/candidate-manifest.json \
            || { echo "ERROR: unexpected bundle layout" >&2; exit 1; }
          echo "BUNDLE_DIR=$PWD/candidate-bundle" >> "$GITHUB_ENV"

      - name: Authenticate npm
        # Uses NODE_AUTH_TOKEN, the standard convention; npm login is
        # not required when an appropriate automation token is configured
        # via the environment secret.
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish candidate (guarded — publishes ONLY the downloaded bundle)
        run: |
          bun run publish:approved -- \
            --tag "${{ github.event.inputs.tag }}" \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --tarball-root "$BUNDLE_DIR"
        env:
          # BUNDAR_RELEASE_TOKEN is the session approval sentinel; the real npm
          # credential travels through NODE_AUTH_TOKEN above.
          BUNDAR_RELEASE_TOKEN: ${{ secrets.BUNDAR_RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish registry verification (byte-for-byte vs the bundle)
        run: |
          bun run registry:verify -- \
            --tag "${{ github.event.inputs.tag }}" \
            --download \
            --manifest "$BUNDLE_DIR/artifacts/release/candidate-manifest.json" \
            --root-dir "$BUNDLE_DIR"

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-report-${{ github.sha }}
          path: |
            artifacts/publish-dry-run.json
            artifacts/registry-verify.json
            candidate-bundle/artifacts/release/candidate-manifest.json
            candidate-bundle/artifacts/release/candidate-identity.json
            candidate-bundle/artifacts/packages/checksums.txt
          retention-days: 365

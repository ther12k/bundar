name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # docs:status-check derives the release-tag fact from
          # `git describe --tags`; a shallow checkout has no tag ancestry.
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Preflight runtime check
        run: bun run preflight
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Architecture boundaries
        run: bun run architecture:check
      - name: Governance documents
        run: bun run docs:check
      - name: Claim/status gates
        run: bun run docs:status-check && bun run issues:check
        env:
          # issues:check shells out to `gh` for live issue states.
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build

  # BR-091: the browser lanes are a required release gate. This dedicated
  # job keeps Chromium failures visible (not masked by `bun test`) and
  # uploads every lane artifact — axe scans and per-step transcripts —
  # bound to the run.
  browser-lanes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for the lane CLI
        run: |
          npx --yes --package @playwright/cli playwright-cli install --with-deps chromium || \
          npx --yes playwright install --with-deps chromium
      - name: Accessibility lane (reference apps)
        run: bun run test:a11y
      - name: No-JS lane (reference apps)
        run: bun run test:no-js
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-lane-artifacts
          path: output/playwright/
          retention-days: 14

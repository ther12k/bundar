name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # docs:status-check derives the release-tag fact from
          # `git describe --tags`; a shallow checkout has no tag ancestry.
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Preflight runtime check
        run: bun run preflight
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Architecture boundaries
        run: bun run architecture:check
      - name: Governance documents
        run: bun run docs:check
      - name: Claim/status gates
        run: bun run docs:status-check && bun run issues:check
        env:
          # issues:check shells out to `gh` for live issue states.
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build

  # BR-091 + BR-100 + BR-156: the browser lanes are a required release
  # gate. The matrix keeps lane statuses independent — a failure in one leg
  # can never skip the other — and each leg uploads its own artifacts with
  # if: always() so failing evidence still binds to the run.
  browser-lanes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [accessibility, no-js]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # BR-099: browsers come from the LOCKFILE-PINNED local Playwright —
      # no unpinned npx fetch anywhere in the lane path.
      - name: Install Chromium via the pinned local Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Accessibility lane (reference apps)
        if: matrix.lane == 'accessibility'
        run: bun run test:a11y
      - name: No-JS lane (reference apps)
        if: matrix.lane == 'no-js'
        run: bun run test:no-js
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-lane-artifacts-${{ matrix.lane }}
          path: output/playwright/
          retention-days: 14
